# Tanner LIVE · MediaMTX (servidor de video). SIN SECRETOS.
#
# Claves comprobadas contra el mediamtx.yml oficial de v1.21.4 (24/11/2026).
# Las cámaras NO se escriben aquí: las da de alta gateway/puente.mjs por la
# API local al arrancar, con la clave del DVR que sólo vive en su memoria.

logLevel: info

# --- Sólo lo que Tanner LIVE usa -------------------------------------------
rtsp: false        # nadie se conecta por RTSP al servidor de video
rtmp: false
srt: false
moq: false
playback: false    # sin grabaciones
webrtc: true
hls: true

# --- API de control: sólo local (el puente da de alta cámaras y corta) ------
api: true
apiAddress: 127.0.0.1:9997

# --- Autorización: cada conexión se le pregunta al puente -------------------
authMethod: http
authHTTPAddress: http://127.0.0.1:9100/autoriza
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- WebRTC (principal) -----------------------------------------------------
# Detrás de Caddy/Nginx con TLS en https://live.tannerycity.com
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: ['https://app.tannerycity.com']
webrtcTrustedProxies: ['127.0.0.1']
webrtcLocalUDPAddress: :8189      # abrir 8189/UDP en el firewall
webrtcLocalTCPAddress: :8189      # y 8189/TCP, para redes que bloquean UDP
webrtcAdditionalHosts: ['live.tannerycity.com']
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# --- HLS (respaldo para Safari) ---------------------------------------------
hlsAddress: 127.0.0.1:8888
hlsAllowOrigins: ['https://app.tannerycity.com']
hlsTrustedProxies: ['127.0.0.1']
hlsVariant: lowLatency

# --- Valores de cada cámara (el puente sólo pone la fuente) -----------------
pathDefaults:
  sourceOnDemand: true            # sólo jala la cámara si alguien está viendo
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  rtspTransport: tcp
  maxReaders: 60                  # tope por cámara; ajustar con la prueba de carga

paths: {}
