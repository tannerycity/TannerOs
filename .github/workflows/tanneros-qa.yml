name: TannerOS QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'v2/**'
      - 'registro/**'
      - 'pedido/**'
      - 'programas/**'
      - 'academias/**'
      - 'centro-tanner/**'
      - 'aviso-de-privacidad/**'
      - 'public-form.*'
      - 'vercel.json'
      - 'scripts/qa-static.mjs'
      - 'scripts/qa-centro-tanner.mjs'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v2/**'
      - 'registro/**'
      - 'pedido/**'
      - 'programas/**'
      - 'academias/**'
      - 'centro-tanner/**'
      - 'aviso-de-privacidad/**'
      - 'public-form.*'
      - 'vercel.json'
      - 'scripts/qa-static.mjs'
      - 'scripts/qa-centro-tanner.mjs'
      - '.github/workflows/tanneros-qa.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Parsing $file"
            node --input-type=module --check < "$file"
          done < <(find v2 -name '*.js' -print0)
          node --input-type=module --check < public-form.js
      - name: TannerOS structural QA
        run: node scripts/qa-static.mjs
      - name: El CDN sirve la version fijada del cliente de Supabase
        shell: bash
        run: |
          set -euo pipefail
          # Los 30 modulos importan el cliente desde v2/supabase-client.js, y ese
          # archivo nombra una version exacta del CDN. Si esa URL no responde, la
          # app entera se queda en blanco — el HTML sigue dando 200, asi que el
          # smoke de rutas no lo veria. Por eso se comprueba aqui, antes de
          # mezclar.
          url="$(grep -o "https://esm.sh/@supabase/supabase-js@[0-9.]*" v2/supabase-client.js | head -1)"
          echo "Cliente fijado en: $url"
          code="$(curl --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 -o /tmp/cliente.js -w '%{http_code}' "$url")"
          test "$code" = '200'
          test "$(wc -c </tmp/cliente.js)" -gt 200
          grep -q 'createClient' /tmp/cliente.js
          echo "OK · el CDN responde y exporta createClient"

  live-smoke:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production propagation
        if: github.event_name == 'push'
        run: sleep 75
      - name: Production canonical routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.tannerycity.com'
          routes=(
            '/'
            '/club/'
            '/direccion/'
            '/finanzas/'
            '/taquilla/'
            '/jugadores/'
            '/asistencia/'
            '/convocatoria/'
            '/calendario/'
            '/academias/'
            '/prospectos/'
            '/scouting/'
            '/pedidos/'
            '/utileria/'
            '/patrocinadores/'
            '/contabilidad/'
            '/usuarios/'
            '/admin/'
            '/admin/auditoria/'
            '/admin/branding/'
            '/admin/club/'
            '/admin/onboarding/'
            '/admin/fotos/'
            '/admin/clubes/'
            '/qa/'
            '/modulos/'
            '/deportivo/'
            '/porteros/'
            '/produccion/'
            '/operacion/programas/'
            '/operacion/academias/'
            '/registro/'
            '/registro/scouting/'
            '/registro/jugadores/'
            '/registro/porteros/'
            '/pedido/'
            '/programas/'
            '/centro-tanner/'
            '/centro-tanner/cambios'
            '/aviso-de-privacidad/'
          )
          for route in "${routes[@]}"; do
            echo "Checking ${base}${route}"
            code="$(curl --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 -o /tmp/page.html -w '%{http_code}' "${base}${route}")"
            test "$code" = '200'
            test "$(wc -c </tmp/page.html)" -gt 120
            ! grep -Eiq '<title>[^<]*404|404: NOT_FOUND|The page could not be found' /tmp/page.html
          done
      - name: Protected module assets stay addressable
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.tannerycity.com'
          assets=(
            '/v2/app.js'
            '/v2/shell.js'
            '/v2/qa/app.js'
            '/v2/qa/styles.css'
            '/v2/jugadores/app.js'
            '/v2/asistencia/app.js'
            '/v2/taquilla/app.js'
            '/v2/branding-auto.js'
          )
          for asset in "${assets[@]}"; do
            echo "Checking asset ${base}${asset}"
            code="$(curl --silent --show-error --retry 4 --retry-delay 3 --max-time 30 -o /tmp/asset -w '%{http_code}' "${base}${asset}")"
            test "$code" = '200'
            test "$(wc -c </tmp/asset)" -gt 80
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Centro Tanner RPC smoke test
        run: node scripts/qa-centro-tanner.mjs
