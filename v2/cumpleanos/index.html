<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07191e">
<title>Cumpleaños · TannerOS</title>
<link rel="stylesheet" href="/v2/styles.css">
<link rel="stylesheet" href="/v2/cumpleanos/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/icons.css?v=20260907a">
<link rel="stylesheet" href="/polish.css?v=20260907a">
</head>
<body>
<main class="shell">
  <section id="loadingView" class="center-card"><div class="brand-mark small">T</div><h2>Cumpleaños</h2><p class="muted">Juntando las fechas…</p></section>
  <section id="deniedView" class="center-card hidden"><div class="brand-mark small">T</div><h2>Sin acceso</h2><p id="deniedText" class="muted">Los cumpleaños los ve el staff del club.</p><a class="secondary nav-link" href="/">Volver</a></section>

  <!-- Cumpleaños (21/10/2026): Zul quiere ver todos, por año y por mes, para
  planear. El año en doce meses; un mes abre su lista por día. -->
  <section id="view" class="hidden app-wrap cu">
    <header class="topbar">
      <div class="brand-lockup compact"><div class="brand-mark small">T</div><div><div class="eyebrow">TANNEROS</div><strong id="orgName"></strong></div></div>
      <div class="top-actions"><a class="secondary mini nav-link" href="/">Inicio</a></div>
    </header>

    <header class="cu-cab">
      <div><h1>Cumpleaños</h1><p id="cuResumen" class="cu-sub">Cargando…</p></div>
      <div class="cu-anio" role="group" aria-label="Año">
        <button type="button" id="cuAnioMenos" aria-label="Año anterior">‹</button>
        <strong id="cuAnio">2026</strong>
        <button type="button" id="cuAnioMas" aria-label="Año siguiente">›</button>
      </div>
    </header>

    <div class="cu-herr">
      <div class="cu-seg" id="cuQuien" role="group" aria-label="Quiénes">
        <button type="button" data-quien="todos" aria-pressed="true">Todos</button>
        <button type="button" data-quien="player" aria-pressed="false">Jugadores</button>
        <button type="button" data-quien="staff" aria-pressed="false">Staff</button>
      </div>
      <select id="cuCategoria" aria-label="Categoría"><option value="">Todas las categorías</option></select>
      <label class="cu-buscar"><span class="tos-icon tos-icon-search" aria-hidden="true"></span><input id="cuBuscar" type="search" placeholder="Buscar nombre" autocomplete="off"></label>
      <button type="button" id="cuCsv" class="secondary mini">Exportar</button>
      <button type="button" id="cuImprimir" class="secondary mini">Imprimir</button>
    </div>

    <p id="cuFaltan" class="cu-faltan hidden"></p>

    <nav id="cuVolver" class="cu-volver hidden"><button type="button" id="cuAlAnio">‹ Todo el año</button></nav>
    <section id="cuMeses" class="cu-meses" aria-label="Meses"></section>
    <section id="cuMes" class="cu-mes hidden" aria-live="polite"></section>
    <p id="cuVacio" class="cu-vacio hidden">Nadie coincide.</p>
  </section>
</main>
<script type="module" src="/v2/branding-auto.js"></script>
<script type="module" src="/v2/cumpleanos/app.js"></script>
</body>
</html>
