name: TannerOS QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'v2/**'
      - 'registro/**'
      - 'pedido/**'
      - 'programas/**'
      - 'academias/**'
      - 'centro-tanner/**'
      - 'aviso-de-privacidad/**'
      - 'public-form.*'
      - 'vercel.json'
      - 'scripts/qa-*.mjs'
      - 'scripts/construir.mjs'
      - 'scripts/barreras/**'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v2/**'
      - 'registro/**'
      - 'pedido/**'
      - 'programas/**'
      - 'academias/**'
      - 'centro-tanner/**'
      - 'aviso-de-privacidad/**'
      - 'public-form.*'
      - 'vercel.json'
      - 'scripts/qa-*.mjs'
      - 'scripts/construir.mjs'
      - 'scripts/barreras/**'
      - 'supabase/migrations/**'
      - '.github/workflows/tanneros-qa.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Parsing $file"
            node --input-type=module --check < "$file"
          done < <(find v2 -name '*.js' -print0)
          node --input-type=module --check < public-form.js
      - name: TannerOS structural QA
        run: node scripts/qa-static.mjs
      - name: Suites unitarias de v2
        shell: bash
        run: |
          set -euo pipefail
          # La lista de suites NO se escribe a mano: se descubre sola.
          #
          # Cuando estaba escrita a mano, dos suites se perdieron al resolver
          # un conflicto entre dos PRs que tocaban este archivo. Siguieron en
          # el repo, dejaron de correr, y CI siguio en verde. Una prueba que
          # nunca se ejecuta no es una barrera, y peor: aparenta serlo.
          #
          # Solo se excluye lo que no puede correr en este job, y cada
          # exclusion dice por que. scripts/qa-suites-excluidas.txt es la lista,
          # y qa-static verifica que no se le cuele nada sin justificar.
          fallos=0
          while IFS= read -r suite; do
            nombre="$(basename "$suite")"
            if grep -qxF "$nombre" scripts/qa-suites-excluidas.txt; then
              echo "· $nombre — excluida a proposito"
              continue
            fi
            echo "→ $nombre"
            node "$suite" || fallos=1
          done < <(find scripts -maxdepth 1 -name 'qa-*.mjs' | sort)
          exit $fallos
      - name: El CDN sirve la version fijada del cliente de Supabase
        shell: bash
        run: |
          set -euo pipefail
          # Los 30 modulos importan el cliente desde v2/supabase-client.js, y ese
          # archivo nombra una version exacta del CDN. Si esa URL no responde, la
          # app entera se queda en blanco — el HTML sigue dando 200, asi que el
          # smoke de rutas no lo veria. Por eso se comprueba aqui, antes de
          # mezclar.
          # Del renglon del export, no de los comentarios: el texto que explica
          # el cambio tambien menciona la URL con el rango flotante, y un
          # `head -1` ingenuo agarraba esa.
          url="$(grep -oE "from '(https://esm\.sh/[^']+)'" v2/supabase-client.js | sed "s/^from '//;s/'$//")"
          echo "Cliente fijado en: $url"
          case "$url" in
            *@[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "El import no apunta a una version exacta"; exit 1 ;;
          esac
          code="$(curl --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 -o /tmp/cliente.js -w '%{http_code}' "$url" || echo 000)"
          echo "  http $code · $(wc -c </tmp/cliente.js) bytes"
          if [ "$code" != '200' ]; then
            echo "El CDN no sirve la version fijada. Ver docs/fotos-que-falta.md y el PR."
            head -c 400 /tmp/cliente.js || true
            exit 1
          fi
          # Hasta aqui llega esta guarda, y a proposito.
          #
          # El riesgo que cierra es concreto: que la URL fijada deje de existir
          # y la app entera se quede en blanco, con el HTML devolviendo 200 —que
          # es justo lo que el smoke de rutas no veria—. Un 200 con un modulo
          # dentro descarta eso.
          #
          # Lo que NO hace: seguir el grafo de reexports. Se intento y el stub de
          # esm.sh cambia de forma —auth-js, tracingRegistry, chunks internos—,
          # asi que la comprobacion fallaba con la URL buena. Perseguir la
          # estructura interna de un CDN ajeno es una prueba fragil que miente en
          # las dos direcciones. Que el grafo resuelva lo prueba abrir la app.
          test "$(wc -c </tmp/cliente.js)" -gt 60
          grep -q 'export' /tmp/cliente.js || { echo "La respuesta no parece un modulo:"; head -c 400 /tmp/cliente.js; exit 1; }
          echo "OK · el CDN responde 200 y devuelve un modulo para la version fijada"

  navegador-qa:
    # Las suites que abren las pantallas de verdad en Chromium (390px, como un
    # iPhone). Hasta el 08/10/2026 no corrian aqui porque este job no
    # instalaba navegador: se corrian a mano antes de subir, y una que no se
    # corriera dejaba pasar una pantalla rota (auditoria de QA, hallazgo P-01).
    #
    # No hay lista escrita a mano: corre toda suite que importe playwright-core.
    # Una suite de navegador nueva entra sola, igual que en static-qa.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright y Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.63.0 playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Suites de navegador
        shell: bash
        run: |
          set -uo pipefail
          fallos=()
          while IFS= read -r suite; do
            nombre="$(basename "$suite")"
            echo "::group::$nombre"
            if ! timeout 300 node "$suite"; then fallos+=("$nombre"); fi
            echo "::endgroup::"
          done < <(grep -l "from 'playwright-core'" scripts/qa-*.mjs | sort)
          if [ "${#fallos[@]}" -gt 0 ]; then
            printf 'Fallaron: %s\n' "${fallos[@]}"
            # Se repiten con el diagnostico: imprime lo que paso dentro de
            # Chromium. No cambia el resultado: el job ya fallo.
            for nombre in "${fallos[@]}"; do
              echo "::group::Diagnostico de $nombre"
              NODE_OPTIONS="--import ./scripts/diagnostico-navegador.mjs" timeout 300 node "scripts/$nombre" || true
              echo "::endgroup::"
            done
            exit 1
          fi
          echo "OK · todas las suites de navegador pasaron"
      - name: Humo de navegador contra lo que publica Vercel
        shell: bash
        run: |
          set -euo pipefail
          # Vercel no publica el repo tal cual: publica dist/, con una huella
          # de contenido en cada URL (scripts/construir.mjs). Las 49 pantallas
          # se abren tambien desde ahi, para que una referencia mal reescrita
          # no llegue a produccion.
          node scripts/construir.mjs
          QA_RAIZ=dist timeout 300 node scripts/qa-humo-navegador.mjs

  live-smoke:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production propagation
        if: github.event_name == 'push'
        run: sleep 75
      - name: Production canonical routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.tannerycity.com'
          routes=(
            '/'
            '/club/'
            '/direccion/'
            '/finanzas/'
            '/taquilla/'
            '/jugadores/'
            '/asistencia/'
            '/convocatoria/'
            '/calendario/'
            '/academias/'
            '/prospectos/'
            '/scouting/'
            '/pedidos/'
            '/utileria/'
            '/patrocinadores/'
            '/contabilidad/'
            '/usuarios/'
            '/admin/'
            '/admin/auditoria/'
            '/admin/branding/'
            '/admin/club/'
            '/admin/onboarding/'
            '/admin/fotos/'
            '/admin/clubes/'
            '/qa/'
            '/modulos/'
            '/deportivo/'
            '/porteros/'
            '/produccion/'
            '/operacion/programas/'
            '/operacion/academias/'
            '/registro/'
            '/registro/scouting/'
            '/registro/jugadores/'
            '/registro/porteros/'
            '/pedido/'
            '/programas/'
            '/centro-tanner/'
            '/centro-tanner/cambios'
            '/aviso-de-privacidad/'
          )
          for route in "${routes[@]}"; do
            echo "Checking ${base}${route}"
            code="$(curl --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 -o /tmp/page.html -w '%{http_code}' "${base}${route}")"
            test "$code" = '200'
            test "$(wc -c </tmp/page.html)" -gt 120
            ! grep -Eiq '<title>[^<]*404|404: NOT_FOUND|The page could not be found' /tmp/page.html
          done
      - name: Protected module assets stay addressable
        shell: bash
        run: |
          set -euo pipefail
          base='https://app.tannerycity.com'
          assets=(
            '/v2/app.js'
            '/v2/shell.js'
            '/v2/qa/app.js'
            '/v2/qa/styles.css'
            '/v2/jugadores/app.js'
            '/v2/asistencia/app.js'
            '/v2/taquilla/app.js'
            '/v2/branding-auto.js'
          )
          for asset in "${assets[@]}"; do
            echo "Checking asset ${base}${asset}"
            code="$(curl --silent --show-error --retry 4 --retry-delay 3 --max-time 30 -o /tmp/asset -w '%{http_code}' "${base}${asset}")"
            test "$code" = '200'
            test "$(wc -c </tmp/asset)" -gt 80
          done
      - name: Archivos con huella se guardan en el telefono
        shell: bash
        run: |
          set -euo pipefail
          # El HTML siempre se revisa; lo que trae ?v=<huella> se guarda un ano
          # sin volver a preguntar. Si esto se pierde, cada pantalla vuelve a
          # pedir 20-30 archivos en cada visita.
          base='https://app.tannerycity.com'
          curl --silent --show-error --retry 4 --retry-delay 3 --max-time 30 -D /tmp/h.txt -o /tmp/inicio.html "${base}/"
          grep -iq '^cache-control:.*no-store' /tmp/h.txt
          url="$(grep -oE '/v2/shell\.css\?v=[0-9a-f]{12}' /tmp/inicio.html | head -1)"
          echo "Asset con huella: ${url}"
          test -n "$url"
          curl --silent --show-error --retry 4 --retry-delay 3 --max-time 30 -D /tmp/h.txt -o /dev/null "${base}${url}"
          grep -i '^cache-control:' /tmp/h.txt
          grep -iq '^cache-control:.*immutable' /tmp/h.txt
          curl --silent --show-error --retry 4 --retry-delay 3 --max-time 30 -D /tmp/h.txt -o /dev/null "${base}/v2/shell.css"
          ! grep -iq '^cache-control:.*immutable' /tmp/h.txt
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Centro Tanner RPC smoke test
        run: node scripts/qa-centro-tanner.mjs
