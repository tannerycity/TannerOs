# Tanner LIVE · MediaMTX de ejemplo (fase 4). SIN SECRETOS.
#
# Claves verificadas contra el mediamtx.yml y la documentación del repositorio
# oficial (bluenviron/mediamtx, v1.21.4) el 23/11/2026. Antes de usarlo,
# compáralo con el mediamtx.yml de la versión que instales.
#
# La URL RTSP con usuario y clave NO va en este archivo. Se inyecta en el
# servidor con una variable de entorno que sobreescribe el parámetro de la
# ruta (verifica el nombre exacto en la doc de tu versión, p. ej.
# MTX_PATHS_TC_CANCHA_1_SOURCE), cargada desde el gestor de secretos del
# servidor. Nunca en el repositorio ni en TannerOS.

logLevel: info

# --- Sólo lo que Tanner LIVE usa -------------------------------------------
rtsp: no          # nadie se conecta por RTSP al gateway
rtmp: no
srt: no
webrtc: yes
hls: yes

# --- API de control: sólo local (el puente expulsa sesiones desde aquí) ----
api: yes
apiAddress: 127.0.0.1:9997

# --- Autorización: cada conexión se pregunta al puente local ---------------
# El puente recibe el JSON de MediaMTX (user, password, token, ip, action,
# path, protocol, id, query), saca el ticket (Bearer en WHEP; ?ticket= en HLS)
# y llama a public.v2_live_gateway_autoriza con la llave de servicio. Responde
# 200 + {"expireAt": "<fin de sesión>"} o 401.
authMethod: http
authHTTPAddress: http://127.0.0.1:9100/autoriza
authHTTPExclude:
  - action: api
  - action: metrics

# --- WebRTC (principal) -----------------------------------------------------
webrtcAddress: 127.0.0.1:8889       # detrás del proxy TLS (live.tannerycity.com)
webrtcLocalUDPAddress: :8189        # abrir 8189/UDP en el firewall del gateway
webrtcLocalTCPAddress: :8189        # respaldo TCP para redes que bloquean UDP
webrtcAdditionalHosts: [live.tannerycity.com]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  # Si muchas familias están detrás de redes móviles estrictas, agregar TURN
  # propio (coturn) con su secreto en el servidor.
webrtcTrustedProxies: [127.0.0.1]

# --- HLS (respaldo para Safari) --------------------------------------------
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsAllowOrigins: ['https://app.tannerycity.com']
hlsTrustedProxies: [127.0.0.1]

# --- Rutas: una por cámara. El nombre = "Ruta en el gateway" en TannerOS ----
pathDefaults:
  sourceOnDemand: yes               # sólo jala la cámara si alguien ve
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  rtspTransport: tcp                # más estable sobre túnel/VPN
  maxReaders: 60                    # tope por cámara; ajustar con la prueba de carga

paths:
  tc-cancha-1:
    # source: <se inyecta por variable de entorno en el servidor>
    # Forma (documentada por Dahua; sin credenciales aquí):
    #   rtsp://USUARIO:CLAVE@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1
    source: publisher               # placeholder: se reemplaza por la variable
