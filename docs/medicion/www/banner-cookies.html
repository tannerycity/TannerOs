<!--
  Banner de cookies de www.tannerycity.com (GoDaddy), v2 (02/11/2026).
  Vive en GTM (GTM-5H8QT73B) como etiqueta "Consentimiento - banner y
  predeterminado", HTML personalizado, activador Consent Initialization - All
  Pages. Este archivo es la copia versionada: lo que se pega en GTM es todo lo
  que va desde la etiqueta script de apertura hasta la de cierre.
  Prueba: scripts/qa-humo-banner-www.mjs.

  - Todo arranca en denied. GA4 escucha el evento tc_cookies y además exige
    analytics_storage: sin "Aceptar" no se carga ni manda nada.
  - "Aceptar" y "Sólo necesarias" usan el mismo estilo (mismo peso).
  - Enlace permanente: cualquier <a> que termine en #cookies (pie de página de
    GoDaddy) o la dirección con #cookies reabren el banner.
  - Revocar: borra _ga, _ga_* y _gid del dominio y sus padres; si GA4 ya estaba
    cargado, recarga la página para que quede limpia.
  - AVISO: URL pública del aviso de privacidad. Se cambia al publicarlo.
-->
<script>
(function(){
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  var KEY = 'tc_cookies_v1';
  var AVISO = 'https://www.tannerycity.com/aviso-de-privacidad';
  gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', wait_for_update: 500 });

  function lee(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } }
  function borraCookiesGA(){
    var partes = location.hostname.split('.'), dominios = [''];
    for (var i = 0; i < partes.length - 1; i++) { var d = partes.slice(i).join('.'); dominios.push(d, '.' + d); }
    document.cookie.split(';').forEach(function(c){
      var n = c.split('=')[0].replace(/^\s+|\s+$/g, '');
      if (n !== '_ga' && n !== '_gid' && n.indexOf('_ga_') !== 0) return;
      dominios.forEach(function(d){
        document.cookie = n + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + (d ? '; domain=' + d : '');
      });
    });
  }
  function aplica(v){
    gtag('consent', 'update', { analytics_storage: v === 'si' ? 'granted' : 'denied' });
    if (v !== 'si') borraCookiesGA();
    dataLayer.push({ event: 'tc_cookies', tc_cookies: v });
  }
  function cierra(){ var b = document.getElementById('tc-cookies'); if (b) b.parentNode.removeChild(b); }
  function guarda(v){
    var antes = lee();
    try { localStorage.setItem(KEY, v); } catch(e) {}
    cierra();
    if (location.hash === '#cookies' && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    if (antes === 'si' && v !== 'si') {
      gtag('consent', 'update', { analytics_storage: 'denied' });
      borraCookiesGA();
      location.reload();
      return;
    }
    aplica(v);
  }
  function banner(){
    if (document.getElementById('tc-cookies')) return;
    var boton = 'flex:1;min-height:44px;border:0;border-radius:10px;background:#07191e;color:#fff;font:inherit;font-weight:700;cursor:pointer';
    var d = document.createElement('div');
    d.id = 'tc-cookies'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-labelledby', 'tc-cookies-texto'); d.setAttribute('tabindex', '-1');
    d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;max-width:560px;margin:0 auto;background:#fff;color:#07191e;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:16px;font:15px/1.4 system-ui,sans-serif;outline:none';
    d.innerHTML = '<p id="tc-cookies-texto" style="margin:0 0 12px">Usamos cookies de analítica para saber cuántas personas visitan el sitio. Sólo se activan si aceptas y puedes cambiar tu decisión en "Cookies", al pie de la página. <a href="' + AVISO + '" style="color:#1f5fbf">Aviso de privacidad</a></p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-v="si" style="' + boton + '">Aceptar</button>'
      + '<button type="button" data-v="no" style="' + boton + '">Sólo necesarias</button></div>';
    d.addEventListener('click', function(e){ var t = e.target.closest ? e.target.closest('[data-v]') : null; if (t) guarda(t.getAttribute('data-v')); });
    document.body.appendChild(d);
    try { d.focus({ preventScroll: true }); } catch(e) { d.focus(); }
  }
  function abre(){ if (document.body) banner(); else document.addEventListener('DOMContentLoaded', banner); }

  var v = lee();
  if (v === 'si' || v === 'no') aplica(v); else abre();
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a[href$="#cookies"]') : null;
    if (!a) return;
    e.preventDefault();
    abre();
  }, true);
  window.addEventListener('hashchange', function(){ if (location.hash === '#cookies') abre(); });
  if (location.hash === '#cookies') abre();
})();
</script>
