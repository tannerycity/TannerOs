<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07191e">
<title>Visorías · TannerOS</title>
<link rel="stylesheet" href="/v2/styles.css">
<link rel="stylesheet" href="/v2/visorias/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/icons.css?v=20260907a">
<link rel="stylesheet" href="/polish.css?v=20260907a">
</head>
<body>
<main class="shell">
  <section id="loadingView" class="center-card"><div class="brand-mark small">T</div><h2>Visorías</h2><p class="muted">Abriendo la visoría…</p></section>
  <section id="deniedView" class="center-card hidden"><div class="brand-mark small">T</div><h2>Sin acceso</h2><p id="deniedText" class="muted">Las visorías las ven Fichajes y Scouting.</p><a class="secondary nav-link" href="/">Volver</a></section>

  <!-- Visorías (29/10/2026, h53). Presidencia: "que pueda iniciar mi campaña
  para saber cuántos se inscribieron, que los visores puedan ver sus datos...
  con sus fotos". Cuántos van, la liga para compartir, cada niño con su foto,
  "Llegó" el día de la visoría y evaluar con un toque. -->
  <section id="view" class="hidden app-wrap vs">
    <header class="topbar">
      <div class="brand-lockup compact"><div class="brand-mark small">T</div><div><div class="eyebrow">TANNEROS</div><strong id="orgName"></strong></div></div>
      <div class="top-actions"><a class="secondary mini nav-link" href="/">Inicio</a></div>
    </header>
    <section id="vsCampana" class="vs-campana"></section>
    <nav class="vs-seg vs-pestanas" role="group" aria-label="Secciones">
      <button type="button" data-vista="inscritos" aria-pressed="true">Inscritos</button>
      <button type="button" data-vista="acceso" aria-pressed="false">Acceso</button>
      <button type="button" data-vista="evento" aria-pressed="false" id="vsTabEvento">Evento</button>
      <button type="button" data-vista="incidentes" aria-pressed="false">Incidentes</button>
    </nav>
    <div class="vs-filtros">
      <div class="vs-seg" id="vsVer" role="group" aria-label="Ver">
        <button type="button" data-ver="todos" aria-pressed="true">Todos</button>
        <button type="button" data-ver="llegaron" aria-pressed="false">Llegaron</button>
        <button type="button" data-ver="faltan" aria-pressed="false">Faltan</button>
      </div>
      <input id="vsBusca" type="search" placeholder="Buscar nombre, folio o escuela" aria-label="Buscar">
    </div>
    <div id="vsVista_inscritos">
      <section id="vsLista" class="vs-lista" aria-live="polite"></section>
      <p id="vsVacio" class="vs-vacio hidden"></p>
    </div>
    <section id="vsVista_acceso" class="hidden"><div id="vsAcceso"></div></section>
    <section id="vsVista_evento" class="hidden"><div id="vsEvento"></div></section>
    <section id="vsVista_incidentes" class="hidden"><div id="vsIncidentes"></div></section>
    <div id="vsMensaje" class="inline-message hidden"></div>
  </section>
</main>
<script src="/v2/tos-dialog.js?v=20260909a"></script>
<script type="module" src="/v2/branding-auto.js"></script>
<script type="module" src="/v2/visorias/app.js"></script>
</body>
</html>
