<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07191e">
<title>Utilería · TannerOS</title>
<link rel="stylesheet" href="/v2/styles.css">
<link rel="stylesheet" href="/v2/utileria/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/icons.css?v=20260907a">
<link rel="stylesheet" href="/polish.css?v=20260907a">
</head>
<body>
<main class="shell">
  <section id="loadingView" class="center-card">
    <div class="brand-mark small">T</div>
    <h2>Utilería</h2>
    <p class="muted">Conectando con la bodega…</p>
  </section>
  <section id="deniedView" class="center-card hidden">
    <div class="brand-mark small">T</div>
    <h2>Sin acceso</h2>
    <p id="deniedText" class="muted"></p>
    <a class="secondary nav-link" href="/v2/modulos/">Volver a módulos</a>
  </section>

  <section id="view" class="hidden app-wrap ut">
    <header class="topbar">
      <div class="brand-lockup compact"><div class="brand-mark small">T</div>
        <div><div class="eyebrow">TANNEROS</div><strong id="orgName"></strong></div></div>
      <div class="top-actions"><a class="secondary mini nav-link" href="/v2/modulos/">Módulos</a><span id="roleBadge" class="role-badge"></span></div>
    </header>

    <!-- Cabecera: dónde estoy y la acción principal, siempre a la mano. -->
    <div class="ut-cab">
      <div>
        <p class="ut-eyebrow" id="utEyebrow">Utilería</p>
        <h1 id="utTitulo">Bodega</h1>
        <p class="ut-resumen" id="utResumen"></p>
      </div>
      <button type="button" id="utEntregar" class="ut-cta hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Entregar</span>
      </button>
    </div>

    <!-- Las tres preguntas del día a día: qué tenemos, quién lo tiene y qué se reportó. -->
    <nav class="ut-seg hidden" id="utSeg" aria-label="Secciones de utilería">
      <a href="#/bodega" data-seg="bodega"><strong id="segBodega">0</strong><span>Qué tenemos</span></a>
      <a href="#/quien" data-seg="quien"><strong id="segQuien">0</strong><span>Quién lo tiene</span></a>
      <a href="#/reportes" data-seg="reportes"><strong id="segReportes">0</strong><span>Reportes</span></a>
    </nav>

    <section id="utPanel" class="ut-panel" aria-live="polite"></section>
  </section>
</main>

<!-- Hoja de abajo: fichas, entregas, formularios. Una sola, se reutiliza. -->
<div id="utFondo" class="ut-fondo hidden">
  <div class="ut-hoja" role="dialog" aria-modal="true" aria-labelledby="utHojaTitulo">
    <div class="ut-asa" aria-hidden="true"></div>
    <div class="ut-hoja-cab">
      <button type="button" id="utHojaAtras" class="ut-hoja-atras hidden" aria-label="Atrás">‹</button>
      <h2 id="utHojaTitulo"></h2>
      <button type="button" id="utHojaCerrar" class="ut-hoja-cerrar" aria-label="Cerrar">&times;</button>
    </div>
    <div id="utHojaCuerpo" class="ut-hoja-cuerpo"></div>
  </div>
</div>
<div id="utAviso" class="ut-aviso" role="status" aria-live="polite" hidden></div>

<script src="/v2/tos-dialog.js?v=20260909a"></script>
<script type="module" src="/v2/branding-auto.js"></script>
<script type="module" src="/v2/utileria/app.js"></script>
</body>
</html>
